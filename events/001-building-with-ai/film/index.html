<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Paper","default":"#F4F0E7"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#20221F"},
    {"id":"color-accent","type":"color","label":"Vermilion","default":"#D74327"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>window.BS_FMT = "wide";</script>
    <script src="assets/data.js"></script>
    <script src="assets/engine.js"></script>
    <script src="assets/field.js"></script>
    <script src="assets/field.engine.js"></script>
    <script src="assets/ground.js"></script>
    <style>
      @font-face {
        font-family: "BS Mono";
        src: url("assets/fonts/JetBrainsMono-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "BS Mono";
        src: url("assets/fonts/JetBrainsMono-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      :root {
        --color-ground: #f4f0e7;
        --color-ink: #20221f;
        --color-accent: #d74327;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: "BS Mono", monospace;
      }
      #paper {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
      data-motion-blur-shutter="240"
    >
      <div id="paper"></div>
      <div id="geo" data-composition-id="geo" data-composition-src="compositions/geo.html"
        data-start="0" data-duration="10.95" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html"
        data-start="0" data-duration="2.6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="copy" data-composition-id="copy" data-composition-src="compositions/copy.html"
        data-start="2.45" data-duration="8.0" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="speakers" data-composition-id="speakers" data-composition-src="compositions/speakers.html"
        data-start="10.85" data-duration="14.5" data-track-index="4" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="25" data-duration="5" data-track-index="5" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:4"></div>
      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="30" data-track-index="6" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
